services:
  # Redis (Key Value store on Render)
  - type: redis
    name: taskforge-redis
    plan: free
    ipAllowList: []

  # Unified Backend API & Playwright Automation Worker Web Service
  - type: web
    name: taskforge-bd
    runtime: node
    plan: free
    rootDir: taskforge/backend
    # Store Chromium inside node_modules so it is included in Render's build
    # artifact. The default /opt/render cache is not reliably retained by the
    # runtime container.
    buildCommand: npm install && npm run build && PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium && PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --list
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false   # Set to Supabase PostgreSQL connection URI in Render Dashboard (Environment tab)
      - key: SUPABASE_URL
        sync: false   # Set to Supabase project URL (e.g. https://zsibgzphnnwwmiusfdlp.supabase.co)
      - key: SUPABASE_SECRET_KEY
        sync: false   # Set to Supabase service_role secret key
      - key: REDIS_URL
        fromService:
          name: taskforge-redis
          type: redis
          property: connectionString
      - key: FRONTEND_URL
        sync: false   # set this to your Vercel URL, e.g. https://task-forge-phi-six.vercel.app
      - key: HEADLESS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
